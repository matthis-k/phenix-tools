# Generated by phenix-flake-ci. Edit the Nix maintenance declaration, not this file.
name: "CI"

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Source"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix formatting"
        run: nix run .#phenix-maintenance -- check nix-format

      - name: "Statix"
        run: nix run .#phenix-maintenance -- check statix

      - name: "Deadnix"
        run: nix run .#phenix-maintenance -- check deadnix

      - name: "Actionlint"
        run: nix run .#phenix-maintenance -- check actionlint

      - name: "Repository boundary"
        run: nix run .#phenix-maintenance -- check boundary

      - name: "Generated workflow"
        run: nix run .#phenix-maintenance -- check workflow-sync

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  product:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Product"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Phenix dev workspace flow"
        run: nix run .#phenix-maintenance -- test phenix-dev

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  checks:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: "Maintenance checks"
    needs:
      - source
      - product
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.product.result }}' == success ]]
